# flashback on one small VM: the app + Caddy (automatic HTTPS). Data lives in ./data on the VM's disk.
#   cp deploy/.env.production.example .env   (then edit it)
#   docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_MAP_START: ${NEXT_PUBLIC_MAP_START:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      FLASHBACK_DATA_DIR: /data
      APP_BASE_URL: https://${DOMAIN}
      GOOGLE_OAUTH_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
    volumes:
      - ./data:/data
    expose:
      - "3000"
    mem_limit: 700m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
